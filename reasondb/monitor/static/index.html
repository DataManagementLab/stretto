<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stretto run monitor</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Crect x='3' y='8' width='2.5' height='5' fill='white'/%3E%3Crect x='6.75' y='5' width='2.5' height='8' fill='white'/%3E%3Crect x='10.5' y='3' width='2.5' height='10' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="header-sticky">
      <header class="topbar">
        <span class="brand">Stretto monitor<span class="sub" id="run-mode"></span></span>
        <nav class="tabs" id="tabs" aria-label="Sections">
          <a href="#/run" data-tab="run">Run</a>
          <a href="#/query" data-tab="query">Queries</a>
          <a href="#/searchspace" data-tab="searchspace">Search space</a>
          <a href="#/optimizer" data-tab="optimizer">Optimizer</a>
          <a href="#/pruning" data-tab="pruning">Pruning</a>
          <a href="#/operators" data-tab="operators">Operators &amp; GPU</a>
          <a href="#/workers" data-tab="workers">Workers &amp; Jobs</a>
          <a href="#/results" data-tab="results">Results</a>
          <a href="#/precompute" data-tab="precompute">Precompute</a>
          <a href="#/events" data-tab="events">Events</a>
        </nav>
        <span class="spacer"></span>
        <span class="run-context" id="run-context" aria-live="polite"></span>
        <span class="status-pill" id="status-pill" data-state="offline">
          <span class="dot"></span><span id="status-text">connecting…</span>
        </span>
        <button id="theme-toggle" type="button" title="Switch light / dark">Theme</button>
      </header>
    </div>

    <main id="view" aria-live="polite">
      <p class="notice">Loading…</p>
    </main>

    <div id="tooltip" role="status"></div>
    <script type="module" src="/static/app.js"></script>
    <noscript>
      <p class="notice error">
        This dashboard needs JavaScript. The same data is on disk: the metrics CSVs under
        your output directory, and the telemetry JSONL under
        <code>&lt;output-dir&gt;/_monitor/</code>.
      </p>
    </noscript>
  </body>
</html>
